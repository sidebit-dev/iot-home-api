server.port: 3333
spring:
  application:
    name: iot-home-api
  datasource:
    url: jdbc:postgresql://iothome-postgres:5432/iot-home-db  # Este é o caminho do postgresql dentro do container
#    url: jdbc:postgresql://localhost:5435/iot-home-db para acessar o POSTGRESQL do container na rede localhost
#    url: jdbc:postgresql://localhost:5432/iot-home-db
    driver-class-name: org.postgresql.Driver
    username: iothome
    password: iothome123
#    username: postgres
