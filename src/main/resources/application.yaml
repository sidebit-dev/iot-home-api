server.port: 3333
spring:
  application:
    name: iot-home-api
  datasource:
    url: jdbc:h2:file:./data/iot-home-db
    #    data é o nome da pasta do banco
    #    url: jdbc:h2:mem:planeja-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update #data definition language - SQL
    #      ddl-auto: create-drop #toda vez que inicializa o app dropa o banco
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
